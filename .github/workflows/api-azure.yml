
name: Publicar API no Azure

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/api-azure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Localizar projeto da API
        id: localizar
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos de projeto encontrados:"
          find api -type f -name "*.csproj" -print

          PROJECT=$(find api -maxdepth 3 -type f -name "*.csproj" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: nenhum arquivo .csproj encontrado dentro de api."
            echo "Conteúdo do repositório:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Projeto selecionado: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Restaurar dependências
        run: dotnet restore "${{ steps.localizar.outputs.project }}"

      - name: Publicar API
        run: |
          dotnet publish "${{ steps.localizar.outputs.project }}" \
            --configuration Release \
            --output "${{ runner.temp }}/publish" \
            --no-restore

      - name: Verificar publicação
        shell: bash
        run: |
          set -e
          ls -lah "${{ runner.temp }}/publish"

          if ! find "${{ runner.temp }}/publish" -maxdepth 1 \
            -type f \( -name "*.dll" -o -name "*.exe" \) \
            | grep -q .; then
            echo "ERRO: nenhum executável .NET foi publicado."
            exit 1
          fi

    
      - name: Publicar no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/publish
