
name: Publicar API no Azure

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/api-azure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Localizar projeto da API
        id: localizar
        shell: bash
        run: |
          set -euo pipefail

          echo "Projetos encontrados:"
          find api -type f -name "*.csproj" -print

          PROJECT=$(find api -type f -name "*.csproj" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: nenhum arquivo .csproj encontrado dentro de api/"
            exit 1
          fi

          echo "Projeto selecionado: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Restaurar dependências
        run: dotnet restore "${{ steps.localizar.outputs.project }}"

      - name: Publicar API
        run: |
          dotnet publish "${{ steps.localizar.outputs.project }}" \
            --configuration Release \
            --output "${{ runner.temp }}/publish"

      - name: Verificar publicação
        shell: bash
        run: |
          set -e
          test -f "${{ runner.temp }}/publish/SmartLockerApi.dll" || {
            echo "Confira o nome da DLL gerada na pasta de publicação."
            ls -la "${{ runner.temp }}/publish"
            exit 1
          }

      - name: Publicar no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/publish

