name: Diagnosticar GitHub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos
        shell: bash
        run: |
          echo "===== RAIZ DO REPOSITÓRIO ====="
          pwd
          ls -la "$GITHUB_WORKSPACE"

          echo "===== VERIFICAR PASTA APP ====="
          if [ -d "$GITHUB_WORKSPACE/app" ]; then
            echo "PASTA APP ENCONTRADA"
            ls -la "$GITHUB_WORKSPACE/app"
          else
            echo "PASTA APP AUSENTE"
          fi

          echo "===== LOCALIZAR PUBSPEC.YAML ====="
          find "$GITHUB_WORKSPACE" -name pubspec.yaml -print

          echo "===== LOCALIZAR PROJETOS FLUTTER ====="
          find "$GITHUB_WORKSPACE" -maxdepth 5 \
            \( -name pubspec.yaml -o -name AndroidManifest.xml \) \
            -print
