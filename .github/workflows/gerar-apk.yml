
name: Diagnosticar GitHub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos
        shell: bash
        run: |
          echo "Raiz do checkout:"
          pwd
          ls -la "$GITHUB_WORKSPACE"

          echo "Pasta app:"
          if [ -d "$GITHUB_WORKSPACE/app" ]; then
            echo "PASTA APP ENCONTRADA"
            ls -la "$GITHUB_WORKSPACE/app"
          else
            echo "PASTA APP AUSENTE"
          fi

          echo "Arquivos pubspec.yaml:"
          find "$GITHUB_WORKSPACE" -name pubspec.yaml -print
```
