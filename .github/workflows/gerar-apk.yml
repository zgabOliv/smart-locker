
name: Gerar APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/gerar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Diagnosticar estrutura
        shell: bash
        run: |
          set -e

          echo "Raiz do repositório:"
          pwd
          ls -la "$GITHUB_WORKSPACE"

          echo "Verificando projeto Flutter:"
          if [ ! -f "$GITHUB_WORKSPACE/app/pubspec.yaml" ]; then
            echo "ERRO: app/pubspec.yaml não encontrado"
            find "$GITHUB_WORKSPACE" -maxdepth 5 \
              -name pubspec.yaml -print
            exit 1
          fi

          echo "Projeto Flutter encontrado."
          cat "$GITHUB_WORKSPACE/app/pubspec.yaml"

      - name: Conferir endereço da API
        shell: bash
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "ERRO: configure API_URL em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          echo "API_URL configurada."

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/app"

          flutter --version

          flutter create . \
            --org br.edu.ifsp \
            --project-name smart_locker_ifsp \
            --platforms=android

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>'
                  '<uses-permission android:name="android.permission.NFC"/>'
                  '<uses-feature android:name="android.hardware.nfc" android:required="false"/>'
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          else:
              if "android.permission.NFC" not in content:
                  content = content.replace(
                      "<application",
                      '<uses-permission android:name="android.permission.NFC"/>'
                      '<application',
                      1,
                  )

              if "android:usesCleartextTraffic" not in content:
                  content = content.replace(
                      "<application",
                      '<application android:usesCleartextTraffic="true"',
                      1,
                  )

          manifest.write_text(content, encoding="utf-8")
          PY

          flutter pub get

      - name: Compilar APK
        shell: bash
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/app"

          flutter build apk \
            --release \
            --dart-define=API_URL="$API_URL"

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-locker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
