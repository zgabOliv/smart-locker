
name: Gerar APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/gerar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Conferir endereço da API
        env:
          API_URL: ${{ vars.API_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$API_URL" ]; then
            echo "ERRO: configure API_URL em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app"

          flutter create . \
            --org br.edu.ifsp \
            --project-name smart_locker_ifsp \
            --platforms=android

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise SystemExit(f"Arquivo não encontrado: {gradle}")

          content = gradle.read_text(encoding="utf-8")

          content, count = re.subn(
              r'(?m)^(\s*compileSdk\s*=\s*).*$',
              r'\g<1>35',
              content,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "Não foi possível configurar compileSdk "
                  "em android/app/build.gradle.kts"
              )

          gradle.write_text(content, encoding="utf-8")

          match = re.search(
              r'(?m)^\s*compileSdk\s*=\s*(\d+)',
              content
          )

          if not match or int(match.group(1)) < 34:
              raise SystemExit("compileSdk precisa ser 34 ou superior.")

          print(f"compileSdk do aplicativo: {match.group(1)}")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")

          for permission in [
              "android.permission.INTERNET",
              "android.permission.NFC",
          ]:
              if permission not in xml:
                  xml = xml.replace(
                      "<application",
                      f'    <uses-permission android:name="{permission}"/>\n'
                      "    <application",
                      1
                  )

          if "android:usesCleartextTraffic" not in xml:
              xml = xml.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          manifest.write_text(xml, encoding="utf-8")
          print("Permissões INTERNET e NFC verificadas.")
          PY

          flutter pub get

          echo "Verificando compileSdk do aplicativo:"
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Corrigir compileSdk do plugin NFC
        shell: bash
        run: |
          set -euo pipefail

          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"

          PLUGIN="$(find "$PUB_CACHE/hosted/pub.dev" \
            -maxdepth 3 \
            -type f \
            \( -path '*/nfc_manager-*/android/build.gradle' \
            -o -path '*/nfc_manager-*/android/build.gradle.kts' \) \
            ! -path '*/example/*' \
            -print -quit)"

          if [ -z "$PLUGIN" ]; then
            echo "Não encontrei o Gradle principal do nfc_manager."
            find "$PUB_CACHE/hosted/pub.dev" \
              -maxdepth 5 -path '*/nfc_manager-*/*' -type f \
              | head -n 60
            exit 1
          fi

          echo "Arquivo principal do plugin: $PLUGIN"

          python3 - "$PLUGIN" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")

          patterns = [
              r'(?m)^(\s*compileSdkVersion\s+)\d+',
              r'(?m)^(\s*compileSdk\s*=\s*)\d+',
              r'(?m)^(\s*compileSdk\s+)\d+',
          ]

          for pattern in patterns:
              content, count = re.subn(
                  pattern, r'\g<1>35', content, count=1
              )
              if count:
                  break

          if not count:
              print("O arquivo não declara compileSdk diretamente.")
              print(content)
              raise SystemExit(1)

          path.write_text(content, encoding="utf-8")
          print("compileSdk do plugin configurado para 35.")
          PY
          
      - name: Compilar APK
        shell: bash
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app"

          flutter build apk \
            --release \
            --dart-define=API_URL="$API_URL"

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-locker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
