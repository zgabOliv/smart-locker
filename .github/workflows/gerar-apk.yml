
name: Gerar APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/gerar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Conferir endereço da API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "ERRO: configure API_URL em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Preparar projeto Android
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/app"

          flutter create . \
            --org br.edu.ifsp \
            --project-name smart_locker_ifsp \
            --platforms=android

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          content = gradle.read_text(encoding="utf-8")

          # Compatível com compileSdk = flutter.compileSdkVersion
          # e compileSdk = 31, entre outros formatos.
          pattern = r'(?m)^(\s*compileSdk\s*=\s*).+$'

          content, count = re.subn(
              pattern,
              r'\g<1>35',
              content,
              count=1
          )

          if count == 0:
              pattern = r'(?m)^(\s*compileSdk\s+).+$'
              content, count = re.subn(
                  pattern,
                  r'\g<1>35',
                  content,
                  count=1
              )

          if count == 0:
              raise SystemExit(
                  "Não encontrei compileSdk. Conteúdo do Gradle:\n"
                  + content
              )

          gradle.write_text(content, encoding="utf-8")
          print("compileSdk configurado para 35.")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>'
                  '<application',
                  1
              )

          if "android.permission.NFC" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.NFC"/>'
                  '<application',
                  1
              )

          if "android:usesCleartextTraffic" not in content:
              content = content.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          manifest.write_text(content, encoding="utf-8")
          PY

          flutter pub get


      - name: Compilar APK
        shell: bash
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/app"

          flutter build apk \
            --release \
            --dart-define=API_URL="$API_URL"

      - name: Verificar APK
        run: |
          test -f app/build/app/outputs/flutter-apk/app-release.apk
          ls -lh app/build/app/outputs/flutter-apk/app-release.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-locker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
